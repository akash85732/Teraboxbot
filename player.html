<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TeraBox Stream Player</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- HLS.js for M3U8 streaming & Plyr Video Player CSS -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    :root {
      --bg-dark: #070913;
      --bg-card: rgba(15, 23, 42, 0.75);
      --bg-card-hover: rgba(30, 41, 59, 0.85);
      --border-glass: rgba(255, 255, 255, 0.1);
      --border-glow: rgba(99, 102, 241, 0.5);
      --accent-primary: #6366f1;
      --accent-secondary: #06b6d4;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
      --accent-glow: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --plyr-color-main: #6366f1;
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glows */
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
      animation: pulseGlow 10s ease-in-out infinite alternate;
    }
    .glow-1 {
      top: -120px;
      left: -120px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.45), transparent 70%);
    }
    .glow-2 {
      bottom: -120px;
      right: -120px;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.4), transparent 70%);
    }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      100% { transform: scale(1.2) translate(30px, 30px); opacity: 0.7; }
    }

    /* Main Container */
    .app-container {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 1;
      position: relative;
    }

    /* Header Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.15rem;
      box-shadow: 0 0 18px var(--accent-glow);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #34d399;
      box-shadow: 0 0 8px #34d399;
      animation: blink 1.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .btn-close-app {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-close-app:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* Player Card & Wrapper */
    .player-card {
      background: var(--bg-card);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .plyr {
      width: 100%;
      height: 100%;
      --plyr-color-main: #6366f1;
      --plyr-control-radius: 8px;
    }

    /* Custom Loading Overlay */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 9, 19, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: var(--accent-primary);
      border-right-color: var(--accent-secondary);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    /* Info Bar & Metadata */
    .info-section {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .title-wrapper {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .video-title {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-main);
      word-break: break-word;
    }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      color: var(--text-muted);
    }

    .pill i {
      color: var(--accent-secondary);
      font-size: 0.85rem;
    }

    .pill.highlight {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
    }

    /* Action Grid */
    .action-grid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: var(--radius-lg);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      width: 100%;
      max-width: 320px;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent-primary);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast i {
      color: #34d399;
      font-size: 1.1rem;
    }

    /* Error View */
    .error-card {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      gap: 16px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: var(--radius-xl);
    }

    .error-card i {
      font-size: 3rem;
      color: #f87171;
    }

    .error-card h3 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fca5a5;
    }

    .error-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      max-width: 400px;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Effects -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="app-container">
    <!-- Top Header -->
    <header>
      <div class="brand-logo">
        <div class="logo-icon">
          <i class="fa-solid fa-play"></i>
        </div>
        <div class="brand-title">TeraBox Player</div>
      </div>
      <div class="header-actions">
        <div class="status-badge">
          <span class="status-dot"></span>
          <span>LIVE STREAM</span>
        </div>
        <button class="btn-close-app" onclick="closeWebApp()" title="Close Player">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </header>

    <!-- Player Card -->
    <div class="player-card">
      <div class="player-wrapper">
        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
          <div class="spinner"></div>
          <div class="loading-text">Connecting to High-Speed Stream...</div>
        </div>

        <video id="player" playsinline controls preload="metadata"></video>
      </div>

      <!-- Info & Metadata Section -->
      <div class="info-section">
        <div class="title-wrapper">
          <h1 class="video-title" id="videoTitle">Loading Media Title...</h1>
        </div>

        <div class="meta-pills">
          <div class="pill highlight">
            <i class="fa-solid fa-hard-drive"></i>
            <span id="fileSizeText">-- MB</span>
          </div>
          <div class="pill">
            <i class="fa-solid fa-clapperboard"></i>
            <span>1080p HD</span>
          </div>
          <div class="pill">
            <i class="fa-solid fa-bolt"></i>
            <span>Ultra Fast CDN</span>
          </div>
          <div class="pill">
            <i class="fa-solid fa-lock"></i>
            <span>SSL Encrypted</span>
          </div>
        </div>

        <div class="action-grid">
          <button id="reloadBtn" class="btn btn-primary" onclick="reloadStream()">
            <i class="fa-solid fa-rotate-right"></i> Reload Player
          </button>
        </div>
      </div>
    </div>

    <!-- Error Card -->
    <div class="error-card" id="errorCard">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <h3>Stream Could Not Be Loaded</h3>
      <p>TeraBox video stream link load nahi ho paya. Link expire ho gaya ho sakta hai.</p>
      <button class="btn btn-primary" onclick="closeWebApp()">
        <i class="fa-solid fa-arrow-left"></i> Back to Telegram
      </button>
    </div>
  </div>

  <!-- Toast Element -->
  <div class="toast" id="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastText">Action completed</span>
  </div>

  <!-- Plyr Video Player JS -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.enableClosingConfirmation) {
        tg.enableClosingConfirmation();
      }
    }

    // Helper: Parse Query Parameters
    const urlParams = new URLSearchParams(window.location.search);
    const rawStreamUrl = urlParams.get('url');
    const rawTitle = urlParams.get('title') || 'TeraBox Stream Video';
    const rawSize = parseInt(urlParams.get('size') || '0', 10);

    // Format File Size
    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return 'Unknown Size';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // Elements
    const playerEl = document.getElementById('player');
    const videoTitleEl = document.getElementById('videoTitle');
    const fileSizeTextEl = document.getElementById('fileSizeText');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const errorCard = document.getElementById('errorCard');

    // Populate Metadata
    if (videoTitleEl) videoTitleEl.textContent = rawTitle;
    if (fileSizeTextEl) fileSizeTextEl.textContent = formatBytes(rawSize);

    let plyrInstance = null;

    function hideOverlay() {
      if (loadingOverlay) {
        loadingOverlay.classList.add('hidden');
      }
    }

    function showError() {
      hideOverlay();
      if (errorCard) {
        errorCard.style.display = 'flex';
      }
    }

    // Load Stream
    if (rawStreamUrl) {
      const isM3U8 = rawStreamUrl.includes('.m3u8') || rawStreamUrl.includes('type=M3U8');

      if (isM3U8 && Hls.isSupported()) {
        const hls = new Hls({
          capLevelToPlayerSize: true,
          autoStartLoad: true
        });
        hls.loadSource(rawStreamUrl);
        hls.attachMedia(playerEl);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          hideOverlay();
        });
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            console.error("HLS fatal error:", data);
            showError();
          }
        });
      } else {
        playerEl.src = rawStreamUrl;
      }

      plyrInstance = new Plyr(playerEl, {
        controls: [
          'play-large', 'restart', 'rewind', 'play', 'fast-forward',
          'progress', 'current-time', 'duration', 'mute', 'volume',
          'settings', 'pip', 'airplay', 'fullscreen'
        ],
        settings: ['speed'],
        speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
        tooltips: { controls: true, seek: true },
        keyboard: { focused: true, global: true }
      });

      playerEl.addEventListener('loadeddata', hideOverlay);
      playerEl.addEventListener('canplay', hideOverlay);
      playerEl.addEventListener('playing', hideOverlay);
      playerEl.addEventListener('error', (e) => {
        console.error("Video element playback error:", e);
        showError();
      });

      // Backup timer to hide spinner after 6 seconds
      setTimeout(hideOverlay, 6000);
    } else {
      showError();
    }

    // Toast Function
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      if (toast && toastText) {
        toastText.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);
      }
    }

    // Reload Stream
    function reloadStream() {
      if (rawStreamUrl) {
        if (loadingOverlay) loadingOverlay.classList.remove('hidden');
        if (errorCard) errorCard.style.display = 'none';
        playerEl.load();
        playerEl.play().then(hideOverlay).catch(() => { hideOverlay(); });
        showToast("Reloading Stream...");
        if (tg && tg.HapticFeedback) {
          tg.HapticFeedback.impactOccurred('medium');
        }
      }
    }

    // Close Web App
    function closeWebApp() {
      if (tg) {
        tg.close();
      } else {
        window.history.back();
      }
    }
  </script>
</body>
</html>
